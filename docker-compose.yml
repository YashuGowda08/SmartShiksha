version: "3.8"

# ─────────────────────────────────────────────────────────────
# Usage:
#   docker compose --profile sqlite  up -d   ← SQLite (default)
#   docker compose --profile postgres up -d  ← PostgreSQL
#   docker compose --profile mongodb  up -d  ← MongoDB
#   docker compose --profile full     up -d  ← PostgreSQL + MongoDB + Backend
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: smart_shiksha_postgres
    profiles: ["postgres", "full"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_shiksha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MongoDB ──
  mongodb:
    image: mongo:7-jammy
    container_name: smart_shiksha_mongo
    profiles: ["mongodb", "full"]
    environment:
      MONGO_INITDB_DATABASE: smart_shiksha
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend (SQLite — no external DB needed) ──
  backend-sqlite:
    build: ./backend
    container_name: smart_shiksha_backend_sqlite
    profiles: ["sqlite"]
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: sqlite
      SQLITE_PATH: /data/smart_shiksha.db
    env_file:
      - ./backend/.env
    volumes:
      - sqlitedata:/data
      - ./backend/app/uploads:/app/app/uploads

  # ── FastAPI Backend (PostgreSQL) ──
  backend-postgres:
    build: ./backend
    container_name: smart_shiksha_backend_pg
    profiles: ["postgres"]
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_shiksha
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  # ── FastAPI Backend (MongoDB) ──
  backend-mongodb:
    build: ./backend
    container_name: smart_shiksha_backend_mongo
    profiles: ["mongodb"]
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: mongodb
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DB: smart_shiksha
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  # ── FastAPI Backend (Full — connects to PostgreSQL by default) ──
  backend-full:
    build: ./backend
    container_name: smart_shiksha_backend_full
    profiles: ["full"]
    ports:
      - "8000:8000"
    environment:
      DB_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_shiksha
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  # ── Next.js Frontend (optional) ──
  frontend:
    build: ./frontend
    container_name: smart_shiksha_frontend
    profiles: ["frontend", "full"]
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local

volumes:
  pgdata:
  mongodata:
  sqlitedata:
