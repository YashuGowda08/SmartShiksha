services:
  - type: web
    name: smartshiksha-backend
    env: docker
    plan: standard

    # Build from backend Dockerfile (Python 3.11 + pinned deps)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Runtime environment
    envVars:
      - key: PIP_NO_CACHE_DIR
        value: "1"
      - key: PIP_PREFER_BINARY
        value: "1"

    # Health check
    healthCheckPath: /health
    healthCheckInterval: 300
    healthCheckTimeout: 10

  - type: web
    name: smartshiksha-frontend
    env: node
    plan: standard
    
    buildCommand: >
      npm install &&
      npm run build
    
    startCommand: npm start
    
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://smartshiksha-backend.onrender.com/api/v1
    
    routes:
      - path: /
        destination: /frontend
